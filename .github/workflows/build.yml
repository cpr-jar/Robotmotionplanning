name: Motion verification
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - serial: 'ON'
            ruckig: 'ON'
            type: Release
            sanitize: 'OFF'
          - serial: 'ON'
            ruckig: 'OFF'
            type: Release
            sanitize: 'OFF'
          - serial: 'OFF'
            ruckig: 'OFF'
            type: Release
            sanitize: 'OFF'
          - serial: 'OFF'
            ruckig: 'ON'
            type: Release
            sanitize: 'OFF'
          - serial: 'ON'
            ruckig: 'ON'
            type: Debug
            sanitize: 'ON'
    env:
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure from bundled sources
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DCMAKE_CXX_FLAGS_DEBUG="-O1 -g1" -DMOTION_WITH_SERIAL=${{ matrix.serial }} -DMOTION_WITH_RUCKIG=${{ matrix.ruckig }} -DMOTION_SANITIZE=${{ matrix.sanitize }}
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - if: matrix.serial == 'ON'
        name: Import, check and export user program
        run: |
          ./build/program_simulator programs/examples/ur5e_demo.yaml --check
          ./build/program_simulator programs/examples/ur5e_demo.yaml --csv build/trace.csv
  parser-fuzz:
    runs-on: ubuntu-latest
    env:
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Build instrumented parser and dependencies
        run: |
          cmake -S . -B build-fuzz -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG="-O1 -g1" -DMOTION_SANITIZE=ON -DMOTION_BUILD_FUZZER=ON -DMOTION_WITH_KDL_REFERENCE=OFF
          cmake --build build-fuzz --target program_parser_fuzzer dxf_parser_fuzzer --parallel 2
      - name: Bounded coverage-guided fuzz run
        run: |
          mkdir -p build-fuzz/corpus build-fuzz/findings
          cp tests/fuzz/corpus/*.yaml build-fuzz/corpus/
          ./build-fuzz/program_parser_fuzzer build-fuzz/corpus -runs=50000 -max_len=8192 -timeout=5 -rss_limit_mb=1024 -seed=4028751910 -artifact_prefix=build-fuzz/findings/
          mkdir -p build-fuzz/dxf-corpus
          cp programs/dxf/rounded_path.dxf build-fuzz/dxf-corpus/
          ./build-fuzz/dxf_parser_fuzzer build-fuzz/dxf-corpus -runs=50000 -max_len=32768 -timeout=5 -rss_limit_mb=1024 -seed=4028751910 -artifact_prefix=build-fuzz/findings/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parser-fuzz-findings
          path: build-fuzz/findings/
  viewer-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tools/motion_viewer -B build-motion-viewer -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-motion-viewer --parallel 2
      - run: ctest --test-dir build-motion-viewer --output-on-failure
  structure-and-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check layout, diagram declarations and standalone public headers
        run: |
          python3 tools/architecture/check_structure.py
          python3 tools/architecture/check_layers.py
          python3 -m unittest discover -s tools/architecture/tests -v
          python3 tools/architecture/check_public_headers.py --with-serial
      - name: Check reproducible offline handbook
        run: |
          python3 -m venv build-doc-venv
          build-doc-venv/bin/pip install -r tools/requirements-docs.txt
          build-doc-venv/bin/python tools/documentation/build_handbook.py --check
      - name: Build separate controller consumer with library defaults
        run: |
          cmake -S examples/integration/consumer -B build-consumer -DROBOT_MOTION_SOURCE_DIR="$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=Release
          cmake --build build-consumer --parallel 2
          ./build-consumer/controller_consumer
      - name: Check sanitizer propagation to an external minimal consumer
        run: |
          cmake -S examples/integration/consumer -B build-consumer-asan -DROBOT_MOTION_SOURCE_DIR="$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG="-O1 -g1" -DMOTION_WITH_SERIAL=OFF -DMOTION_SANITIZE=ON
          cmake --build build-consumer-asan --parallel 2
          UBSAN_OPTIONS=halt_on_error=1 ./build-consumer-asan/controller_consumer
  component-consumers:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        case: [execution, planning, serial_kinematics, serial_planning, differential_kinematics, calibration, dxf_import, model_import, program, serial, following]
    steps:
      - uses: actions/checkout@v4
      - name: Build independent consumer and inspect actual CMake source graph
        run: python3 tools/architecture/check_components.py --case ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: component-${{ matrix.case }}-failure
          path: build-components/${{ matrix.case }}/validation.log
